<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="7ZkU75VcMSZZ-5SDmH2aYfM4Ihwi61LJbAmDul-y7Hw" />
<title>DoctorSnort</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1b1b;
    --muted: #5f6368;
    --accent: #1a6fb5;
    --line: #e3e3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --muted: #a8a8a8;
      --accent: #7ab8e8;
      --line: #2c2c2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 64px 20px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  .muted { color: var(--muted); margin: 0 0 36px; }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .desc { color: var(--muted); font-size: 0.92rem; }
</style>
</head>
<body>
<main>

  <h1>DoctorSnort</h1>
  <p class="muted">Пет-проекты.</p>

  <h2>Проекты</h2>
  <ul>
    <li>
      <a href="zakazano/">Заказано</a>
      <div class="desc">
        Личный справочник по заведениям и блюдам. Android.
        <a href="https://github.com/DoctorSnort/zakazano">Исходный код</a>
      </div>
    </li>
  </ul>

</main>
</body>
</html>
